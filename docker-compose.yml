services:
  postgres:
    image: postgres:16-alpine
    container_name: conecta-postgres
    environment:
      POSTGRES_USER: conecta_user
      POSTGRES_PASSWORD: conecta_password
      POSTGRES_DB: conecta_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conecta-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: conecta-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/realm-conecta-ufc.json:/opt/keycloak/data/import/realm-conecta-ufc.json:ro
    depends_on:
      - mailpit
    networks:
      - conecta-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: conecta-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - conecta-network

  backend:
    build:
      context: ./conecta-ufc-backend
    container_name: conecta-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./conecta-ufc-backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://conecta_user:conecta_password@postgres:5432/conecta_db
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_REALM: conecta-ufc
      KEYCLOAK_CLIENT_ID: conecta-ufc-backend
      KEYCLOAK_CLIENT_SECRET: conecta-ufc-dev-secret
      FRONTEND_ORIGIN: http://localhost:5173
      SYNC_API_KEY: conecta-ufc-dev-key
    depends_on:
      - postgres
      - keycloak
    networks:
      - conecta-network

  scrapings:
    build:
      context: ./conecta-ufc-scrapings
    container_name: conecta-scrapings
    ports:
      - "8001:8001"
    env_file:
      - path: ./conecta-ufc-scrapings/.env
        required: false
    environment:
      SQLALCHEMY_DATABASE_URL: sqlite:////app/data/scrapings.db
      CORE_API_URL: http://backend:8000/internal/sync
      CORE_API_KEY: conecta-ufc-dev-key
    volumes:
      - ./conecta-ufc-scrapings/data:/app/data
    networks:
      - conecta-network

networks:
  conecta-network:
    driver: bridge

volumes:
  keycloak_data:
  postgres_data:
